name: CI

on:
  pull_request:
  push:
    branches: [legacy]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
      - name: Build and verify
        run: ./mvnw -B clean verify
