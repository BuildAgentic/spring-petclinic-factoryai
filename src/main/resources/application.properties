# database init, supports mysql too
database=hsqldb
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql
# Spring Boot 1.5 initialized every datasource (not only embedded ones) on startup
spring.sql.init.mode=always

# Web
spring.thymeleaf.mode=HTML
# error.html displays the exception message, which Spring Boot 2.3+ hides by default
server.error.include-message=always
server.error.include-exception=true

# JPA
spring.jpa.hibernate.ddl-auto=none

# Internationalization
spring.messages.basename=messages/messages

# Actuator / Management
management.endpoints.web.base-path=/manage
# Spring Boot 1.5 exposed every actuator endpoint over HTTP with management.security.enabled=false
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Active Spring profiles
spring.profiles.active=production
